apiVersion: apps/v1
kind: Deployment
metadata:
  name: autonomous-sre-agent
  labels:
    app: autonomous-sre-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: autonomous-sre-agent
  template:
    metadata:
      labels:
        app: autonomous-sre-agent
    spec:
      serviceAccountName: autonomous-sre-agent
      containers:
        - name: autonomous-sre-agent
          image: autonomous-sre-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.main"]
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: autonomous-sre-agent-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: autonomous-sre-agent-secrets
                  key: gemini_api_key
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: embeddings
              mountPath: /app/data/embeddings
      volumes:
        - name: embeddings
          emptyDir: {}
